apiVersion: apps/v1
kind: Deployment
metadata:
  name: sit-to-stand
  namespace: sit-to-stand
  labels:
    app: sit-to-stand
spec:
  replicas: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sit-to-stand
  template:
    metadata:
      labels:
        app: sit-to-stand
    spec:
      automountServiceAccountToken: false
      containers:
        - name: sit-to-stand
          image: YOUR_ACR_NAME.azurecr.io/sit-to-stand:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 101
            seccompProfile:
              type: RuntimeDefault
