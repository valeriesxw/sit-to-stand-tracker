# Sit-to-Stand CI/CD Pipeline
# GitHub -> Azure Pipelines -> ACR -> AKS

trigger:
- main

resources:
- repo: self

variables:
  dockerRegistryServiceConnection: '6ee8b34a-ba45-4e83-95ca-384f2ec19d8b'
  imageRepository: 'valeriesxwsittostandtracker'
  containerRegistry: 'valeriesxwpose2026.azurecr.io'
  dockerfilePath: '**/Dockerfile'
  tag: '$(Build.BuildId)'
  imagePullSecret: 'valeriesxwpose20267564fa34-auth'
  vmImageName: 'ubuntu-24.04'

stages:

# ==========================================
# BUILD STAGE
# ==========================================

- stage: Build
  displayName: Build stage

  jobs:
  - job: Build
    displayName: Validate, build and push

    pool:
      vmImage: $(vmImageName)

    steps:
    - checkout: self
      displayName: Download source code

    - bash: |
        echo "Checking index.html..."
        npx --yes html-validate index.html
      displayName: Validate HTML

    - bash: |
        echo "Checking app.js..."
        node --check app.js
      displayName: Validate JavaScript

    - task: Docker@2
      displayName: Build and push Docker image
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        Dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

    - publish: manifests
      artifact: manifests
      displayName: Publish Kubernetes manifests

# ==========================================
# DEPLOY STAGE
# ==========================================

- stage: Deploy
  displayName: Deploy stage
  dependsOn: Build
  condition: succeeded()

  jobs:
  - deployment: Deploy
    displayName: Deploy to AKS

    pool:
      vmImage: $(vmImageName)

    environment: 'valeriesxwsittostandtracker-1729.sit-to-stand'

    strategy:
      runOnce:
        deploy:
          steps:
          - task: KubernetesManifest@1
            displayName: Create image pull secret
            inputs:
              action: createSecret
              secretName: $(imagePullSecret)
              dockerRegistryEndpoint: $(dockerRegistryServiceConnection)

          - task: KubernetesManifest@1
            displayName: Deploy application to AKS
            inputs:
              action: deploy
              manifests: |
                $(Pipeline.Workspace)/manifests/deployment.yml
                $(Pipeline.Workspace)/manifests/service.yml
              imagePullSecrets: |
                $(imagePullSecret)
              containers: |
                $(containerRegistry)/$(imageRepository):$(tag)
